name: CI/CD Calculator Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: (1 & 2) Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: (3) CI - Install Dependencies & Run Automated Tests
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest

    - name: Generate Unique Image Tag
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: (4) Build & Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/calculator:${{ steps.vars.outputs.sha_short }}
          ${{ secrets.DOCKERHUB_USERNAME }}/calculator:latest

    - name: (5) Deployment - Setup Kubernetes Simulator (Official Helm Kind)
      uses: helm/kind-action@v1.10.0

    - name: Inject Unique Tag & Deploy Manifests Separately
      run: |
        # Injects your fetched username and generated short SHA tag into the deployment manifest dynamically
        sed -i "s|DOCKERHUB_USERNAME/calculator:tag-placeholder|${{ secrets.DOCKERHUB_USERNAME }}/calculator:${{ steps.vars.outputs.sha_short }}|g" deployment.yaml
        
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        
        # Verify the resources running inside the runner cluster
        kubectl get deployment calculator-deployment
        kubectl get svc calculator-service
