name: CI/CD Calculator Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    # -------------------------------------------------------------
    # STAGE 1 & 2: SOURCE CODE & VERSION CONTROL
    # -------------------------------------------------------------
    - name: (1 & 2) Checkout Source Code
      uses: actions/checkout@v4

    # -------------------------------------------------------------
    # STAGE 3: CONTINUOUS INTEGRATION (Testing)
    # -------------------------------------------------------------
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: (3) CI - Install Dependencies & Run Automated Tests
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest
        pytest

    # -------------------------------------------------------------
    # STAGE 4: BUILD (Docker Containerization)
    # -------------------------------------------------------------
    - name: Generate Unique Image Tag (Short SHA)
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: (4) Build & Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/calculator:${{ steps.vars.outputs.sha_short }}
          ${{ secrets.DOCKERHUB_USERNAME }}/calculator:latest

    # -------------------------------------------------------------
    # STAGE 5: DEPLOYMENT (Kubernetes Orchestration)
    # -------------------------------------------------------------
    - name: (5) Setup Local Kubernetes Cluster (Kind)
      uses: engineerd/setup-kind@v0.5.0

    - name: Inject Unique Tag & Deploy to Kubernetes
      run: |
        # Replaces placeholder in k8s manifest with the unique push tag
        sed -i "s|DOCKERHUB_USERNAME/calculator:v1.0.0|${{ secrets.DOCKERHUB_USERNAME }}/calculator:${{ steps.vars.outputs.sha_short }}|g" k8s.yaml
        
        kubectl apply -f k8s.yaml
        
        # Verify Resources Are Rolling Out Successfully
        kubectl rollout status deployment/calculator-deployment
        kubectl get service calculator-service
